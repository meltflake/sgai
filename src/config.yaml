site:
  name: 新加坡 AI 观察
  site: 'https://sgai.md'
  base: '/'
  # Cloudflare Pages serves /debates/ for /debates/index.html and 308-redirects
  # /debates → /debates/. Emit trailing-slash URLs from getPermalink() so
  # internal navigation lands directly without a round-trip redirect.
  trailingSlash: true

metadata:
  title:
    default: 新加坡 AI 观察
    # Short brand token; full site name stays in og:site_name + WebSite JSON-LD.
    template: '%s · sgai'
  description: '持续整理新加坡 AI 相关政策、治理框架与落地执行情况。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 新加坡 AI 观察
    images:
      - url: '~/assets/images/og-default.png'
        width: 1200
        height: 630
    type: website

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-6QWH6QHG2X'

ui:
  theme: 'system'
