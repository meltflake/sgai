# Production deploy: build on GitHub Actions, push dist/ to Cloudflare Pages
# via wrangler Direct Upload.
#
# Why this exists (2026-07-05): the git-integrated Cloudflare build queued a
# full ~12-min build for EVERY commit pushed to main — a burst of 9 merges
# meant ~2 hours of serial builds, most of them for commits already
# superseded. The `concurrency` block below is the fix: a newer push to main
# cancels any in-flight/queued deploy, so only the latest commit ever ships.
#
# ── Cutover checklist (one-time, dashboard side) ─────────────────────────
# Until the two secrets below exist, this workflow builds + gate-checks but
# SKIPS the deploy step with a notice — the legacy Cloudflare git-integration
# build keeps serving production, so merging this is zero-risk.
#
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token
#      (template "Edit Cloudflare Workers"/Pages, scope: Account.Cloudflare
#      Pages:Edit). Account ID is on the Pages project overview page.
#   2. GitHub repo → Settings → Secrets and variables → Actions:
#        CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   3. Direct Upload cannot target a git-connected Pages project. Create a
#      fresh project:  npx wrangler pages project create sgai-ci
#      then set repo Variable CLOUDFLARE_PAGES_PROJECT=sgai-ci, let this
#      workflow deploy once, verify the *.pages.dev preview, and move the
#      custom domain sgai.md from the old project to the new one.
#   4. Pause/delete the old project's automatic git builds.
#
# Manual redeploy of current main: Actions tab → Deploy → Run workflow.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One production deploy at a time; a newer commit cancels older runs —
# this is what kills the "9 merges = 9 serial builds" queue amplification.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Astro's asset cache (remote YouTube thumbnails etc.) lives in
      # node_modules/.astro. Restore AFTER npm ci — npm ci wipes
      # node_modules, so restoring first would be undone. Unique key +
      # prefix restore = always save fresh, always restore newest.
      - name: Restore Astro asset cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: |
            astro-assets-

      - run: npm run build

      # Dist-layer gates (i18n residue, JSON-LD schema, zh-tw misconversion)
      # must pass before anything ships.
      - run: npm run check:dist

      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured — build verified but not deployed (cutover pending, see header of this workflow)."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sgai-ci' }} --branch=main --commit-dirty=true
