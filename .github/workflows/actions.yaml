name: GitHub Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # PR gate only: on main pushes, deploy.yaml builds (and runs check:dist)
  # anyway — building here too would double the Actions minutes per merge.
  # Node matrix trimmed to 22 (the version the site deploys on): the 18/20
  # legs tripled build cost without ever catching a version-specific break.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # addedAt-coverage eval needs the merge-base with main to diff
          # records added in the PR. fetch-depth: 0 = full history.
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Enforce that every new data record carries `addedAt`. Without it the
      # homepage "最近更新" derive layer (src/utils/derived-updates.ts) would
      # silently miss the change. See scripts/evals/addedAt-coverage/check.ts
      # for the failure mode this catches.
      - name: addedAt coverage (PR diff vs main)
        run: npm run eval:addedAt -- --base=origin/main

      # Enforce that every src/data/*.ts is owned by a refresh pipeline
      # (`targets[]`) or listed under `editorial` in scripts/refresh/registry.json.
      # A new data file with no owner = a new page that auto_update.py can never
      # refresh and that nobody is alarmed about. Also fails if a manifest path
      # is stale (file renamed/removed). Full-state check — no --base needed.
      # See scripts/evals/coverage-audit/check.ts.
      - name: coverage audit (every data file has a refresh owner)
        run: npm run eval:coverage-audit

      # Enforce that every mddiSpeeches entry in voices.ts has a matching
      # speechTranscripts entry with non-empty paragraphs + paragraphsEn.
      # Without it, /speeches/<id>/ silently renders the "尚未本地存档"
      # fallback. See scripts/evals/transcript-coverage/check.ts.
      - name: transcript coverage (PR diff vs main)
        run: npm run eval:transcript -- --base=origin/main

      # Enforce that no new transcript leaks page chrome (breadcrumb, CMS
      # migration notice, footer/legal) into its body. Content-quality gate
      # complementing the coverage gate above — coverage checks the transcript
      # EXISTS and is non-empty, quality checks the content isn't noise. See
      # scripts/evals/transcript-quality/check.ts + scripts/lib/transcript-noise.ts.
      - name: transcript quality (PR diff vs main)
        run: npm run eval:transcript-quality -- --base=origin/main

      # Enforce that every videos.ts entry has a matching videoTranscripts
      # record with triple-aligned paragraphs (zh + en + ja) — or an
      # explicit `source: 'unavailable'` placeholder for videos with no
      # captions. Without it, /ja/videos/<id>/ (and zh/en) falls back to
      # the dev-targeted "No readable content for this video yet. Run npm
      # run fetch:video-transcripts" message. See
      # scripts/evals/video-transcript-coverage/check.ts.
      - name: video transcript coverage (PR diff vs main)
        run: npm run eval:video-transcript -- --base=origin/main

      # Layer E — source-level i18n hardcode scan.
      # Hard-fails when a PR introduces NEW `lang === 'zh' ?` / `isZh ?` /
      # binary-lang-alias / `COPY[lang] ?? COPY.en` (missing ja/ko) anti-patterns
      # above the snapshotted baseline. The baseline is now EMPTY (0 findings):
      # the 2026-07 governance pass burned down the entire grandfathered backlog,
      # so ANY new finding fails the gate. Re-snapshot via
      # `npm run eval:source-i18n -- --baseline` only after a deliberate,
      # reviewed change. See scripts/evals/source-i18n-hardcode/check.ts for the
      # failure mode and docs/CHANGELOG.md (2026-05-10) for the regression context.
      - name: Source i18n hardcode scan (no new findings beyond baseline)
        run: npm run eval:source-i18n
